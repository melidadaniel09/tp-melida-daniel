<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Ubicaciones — Rick &amp; Morty</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon" aria-hidden="true">🌀</span>
        <h1>Portal de Ubicaciones</h1>
      </div>
      <p class="header-sub">Explora los rincones del multiverso de Rick &amp; Morty</p>
    </div>
  </header>

  <main>
    <section class="search-section" aria-label="Buscador">
      <form id="search-form" class="search-form" novalidate>
        <div class="form-group">
          <label for="input-name">Nombre de la ubicación</label>
          <input
            type="text"
            id="input-name"
            name="name"
            placeholder="Ej: Earth, Citadel…"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="input-type">Tipo de ubicación</label>
          <input
            type="text"
            id="input-type"
            name="type"
            placeholder="Ej: Planet, Space station…"
            autocomplete="off"
          />
        </div>

        <button type="submit" id="btn-search" class="btn-search">
          Buscar
        </button>
      </form>

      <p id="form-warning" class="form-warning" role="alert" aria-live="polite" hidden>
        Ingresá al menos un criterio de búsqueda.
      </p>
    </section>

    <section aria-label="Resultados" aria-live="polite">
      <p id="status-msg" class="status-msg" role="status" hidden></p>
      <div id="results-grid" class="results-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Jesús Daniel Melida González &mdash; Variante B &middot; Fundamentos de Desarrollo Web 2026</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
